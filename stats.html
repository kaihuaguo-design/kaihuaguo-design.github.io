<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>访问统计 · PORTFOLIO</title>
  <!-- 只给自己看的统计页：网站里没有任何入口链到这里。数字来自 app.js 里的两个计数器 -->
  <style>
    :root{--ink:#121a3f;--muted:#5d6a85;--gold:#a8782f;--line:#23305a26;--card:#ffffffd9;--bg:radial-gradient(120% 90% at 50% 30%,#f2f5f8 0%,#dbe4ea 60%,#c3d0d8 100%)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:40px 16px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
    h1{margin:0;font-family:Didot,"Bodoni 72","Times New Roman",serif;font-weight:400;font-size:clamp(34px,7vw,64px);letter-spacing:-.04em;background:linear-gradient(100deg,#0d1638,#36507f 55%,#9a7a46);-webkit-background-clip:text;background-clip:text;color:transparent}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:min(100%,640px)}
    .card{padding:26px 24px 22px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px #fff,0 18px 40px -18px #3a4a6e66}
    .card p{margin:0;font-size:13px;letter-spacing:1px;color:var(--muted)}
    .card b{display:block;margin:12px 0 6px;font-family:Didot,"Bodoni 72","Times New Roman",serif;font-weight:400;font-size:clamp(44px,10vw,76px);line-height:1;font-variant-numeric:tabular-nums}
    .card small{font-size:12px;color:var(--muted)}
    .card:nth-child(2) b{color:var(--gold)}
    .bar{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted)}
    button{font:inherit;font-size:13px;padding:10px 20px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:default}
    .note{max-width:640px;margin:0;font-size:12px;line-height:1.8;color:var(--muted);text-align:center}
    @media (max-width:420px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Statistics</h1>
  <div class="grid">
    <div class="card"><p>访问量</p><b id="visits">—</b><small>打开网站的次数（同一窗口内刷新只算一次）</small></div>
    <div class="card"><p>下载量</p><b id="downloads">—</b><small>点击“下载 PDF”的次数</small></div>
  </div>
  <div class="bar"><button id="refresh">刷新</button><span id="state" aria-live="polite"></span></div>
  <p class="note">本机预览不计数。计数器连续半年没有新的访问会被清空。</p>
  <script>
    const API = 'https://abacus.jasoncameron.dev/get/kaihuaguo-design/';
    const btn = document.getElementById('refresh'), state = document.getElementById('state');
    async function load() {
      btn.disabled = true; state.textContent = '读取中…';
      try {
        const vals = await Promise.all(['visits', 'downloads'].map(async k => {
          const r = await fetch(API + k, { cache: 'no-store' });
          const v = r.ok ? (await r.json()).value : 0;
          document.getElementById(k).textContent = Number(v || 0).toLocaleString('zh-CN');
          return v;
        }));
        state.textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      } catch {
        state.textContent = '暂时连不上计数服务，请稍后再刷新';
      }
      btn.disabled = false;
    }
    btn.addEventListener('click', load);
    load();
  </script>
</body>
</html>
